name: text_comparison_score_codespark
description: "String similarity for Dart & Flutter. Calculate match percentages using Levenshtein Distance and Jaro-Winkler. Supports fuzzy matching and case-insensitive comparison."
version: 0.0.9
homepage: https://github.com/Katayath-Sai-Kiran/text_comparison_score_codespark

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">= 1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

screenshots:

  - description: 'Score overview — live similarity scores for multiple string pairs.'
    path: assets/screenshot_1.png

  - description: 'Algorithm comparison — Levenshtein vs Jaro-Winkler side by side.'
    path: assets/screenshot_2.png

  - description: 'Edge cases — identical strings, empty strings, and case-sensitivity.'
    path: assets/screenshot_3.png




topics:
  - string-similarity
  - fuzzy-matching
  - string-comparison
  - text-similarity
  - levenshtein-distance